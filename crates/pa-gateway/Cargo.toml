[package]
name = "pa-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embeddable, multi-user access to Prime Agent sessions."

[features]
default = []
http = ["dep:axum"]

[dependencies]
pa-types.workspace = true
pa-telemetry.workspace = true
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "embedded"
required-features = ["http"]

[lints]
workspace = true
